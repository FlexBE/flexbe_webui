name: Lightweight CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [flake8, py_compile, smoke]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            fastapi \
            flake8 \
            pytest \
            flake8-bugbear \
            flake8-builtins \
            flake8-import-order \
            flake8-quotes \
            pydantic \
            pygments \
            pyyaml \
            uvicorn \
            websockets

      - name: Run flake8
        if: matrix.check == 'flake8'
        run: python -m flake8 .

      - name: Run py_compile
        if: matrix.check == 'py_compile'
        run: python -m py_compile $(git ls-files '*.py')

      - name: Run In-Process Smoke Test
        if: matrix.check == 'smoke'
        run: python -m pytest test/test_smoke_server.py -v
